<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0c10">
  <meta name="description" content="GameOn offline companion. Discover your game, shortlist café favourites and plan your next session. No account or internet needed.">
  <meta http-equiv="Content-Security-Policy" content="__CSP__">
  <title>GameOn — Play, eat, repeat.</title>
  <style>__STYLE__</style>
</head>
<body>
  <div id="app">
    <header class="app-header"><button class="wordmark" data-go="play" aria-label="GameOn home">GAME<span>ON</span><b>.</b></button><div class="header-actions"><span class="offline-badge"><i></i> OFFLINE READY</span><button class="icon-btn" id="theme-button" aria-label="Switch theme"></button></div></header>
    <main id="main" tabindex="-1"></main>
    <nav id="nav" aria-label="App navigation"></nav>
  </div>
  <dialog id="sheet" aria-labelledby="sheet-title"><div class="sheet-handle" aria-hidden="true"></div><div id="sheet-content"></div><button class="sheet-close icon-btn" id="sheet-close" aria-label="Close panel"></button></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>This app needs JavaScript enabled to save local plans and display the catalogue.</noscript>

</html>
